name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency: # a newer push cancels the running check (saves Actions minutes)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes count 10× in private repos → only once, with the recommended Node
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Unit tests
        run: npm test

      - name: Build web UI
        run: npm run build:web

      - name: Server smoke test (mock mode)
        shell: bash
        env:
          COCKPIT_MOCK: '1'
          OPEN_BROWSER: 'false'
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4317/api/health || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          cat server.log
          [ "$code" = "401" ] || { echo "::error::/api/health antwortet $code statt 401"; exit 1; }
          curl -s -H 'Accept-Language: de-DE' http://localhost:4317/ | grep -q 'Cockpit einrichten' || { echo "::error::Einrichtungsseite (de) fehlt"; exit 1; }
          curl -s -H 'Accept-Language: en-US' http://localhost:4317/ | grep -q 'Set up the cockpit' || { echo "::error::setup page (en) missing"; exit 1; }
          kill $pid || true

      - name: Browser end-to-end (headless + headed)
        if: matrix.node == 24
        shell: bash
        env:
          E2E_ENGINE: chrome
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:browser; else npm run test:browser; fi
